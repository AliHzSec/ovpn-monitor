<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitoring — Login</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/theme.css?v=2">
    <style>
        /* Page-specific styles only. Colors, typography and shared components
           live in /static/theme.css. */

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ── CARD ── */
        .card {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-secondary);
            border-radius: 16px;
            padding: 40px 32px 34px;
            width: 100%;
            max-width: 400px;
            box-shadow:
                inset 0 1px rgba(255, 255, 255, 0.03),
                0 28px 72px rgba(0, 0, 0, 0.55);
            animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            transition: box-shadow 0.4s, border-color 0.3s;
        }

        .card:hover {
            border-color: var(--border);
            box-shadow:
                inset 0 1px rgba(255, 255, 255, 0.04),
                0 28px 72px rgba(0, 0, 0, 0.55),
                0 0 100px color-mix(in srgb, var(--color-primary) 8%, transparent);
        }

        /* gradient top border */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            border-radius: 16px 16px 0 0;
            background: linear-gradient(90deg,
                    transparent 0%,
                    var(--color-primary) 30%,
                    var(--color-success) 70%,
                    transparent 100%);
            opacity: 0.85;
        }

        /* ── HEADER ── */
        .card-header {
            margin-bottom: 30px;
            animation: fadeUp 0.4s 0.1s ease backwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .card-brand {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: var(--sp-5);
        }

        .card-brand-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--color-success);
            box-shadow: 0 0 8px var(--color-success);
            animation: livepulse 1.1s ease-in-out infinite;
        }

        .card-brand-text {
            font-family: var(--font-brand);
            font-size: var(--fs-caption);
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        h1 {
            font-family: var(--font-sans);
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--text);
            line-height: var(--lh-tight);
        }

        h1 .hello-dim {
            color: var(--text-tertiary);
            font-weight: 300;
        }

        .card-subtitle {
            font-size: var(--fs-sm);
            color: var(--text-tertiary);
            margin-top: 6px;
        }

        /* ── ERROR BOX ── */
        .error {
            display: flex;
            align-items: center;
            gap: 9px;
            background: var(--error-soft);
            border: 1px solid color-mix(in srgb, var(--color-error) 30%, transparent);
            border-left: 3px solid var(--color-error);
            color: var(--color-error);
            padding: 11px 14px;
            font-size: var(--fs-sm);
            border-radius: var(--radius-ctl);
            margin-bottom: var(--sp-5);
            animation: shake 0.35s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        .error svg {
            flex-shrink: 0;
        }

        /* ── FORM ── */
        .field {
            margin-bottom: var(--sp-4);
            animation: fadeUp 0.4s ease backwards;
        }

        .field:nth-child(1) {
            animation-delay: 0.15s;
        }

        .field:nth-child(2) {
            animation-delay: 0.20s;
        }

        label {
            display: block;
            font-family: var(--font-sans);
            font-size: var(--fs-label);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: var(--ls-label);
            color: var(--text-secondary);
            margin-bottom: var(--sp-2);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: var(--text-tertiary);
            pointer-events: none;
            display: flex;
            transition: color 0.2s;
        }

        .field:focus-within .input-icon {
            color: var(--color-primary);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border-secondary);
            color: var(--text);
            padding: 12px 12px 12px 38px;
            font-family: var(--font-sans);
            font-size: var(--fs-body);
            line-height: var(--lh-body);
            border-radius: var(--radius-ctl);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        input::placeholder {
            color: var(--text-tertiary);
            font-size: var(--fs-body);
        }

        /* ── SUBMIT BUTTON ── */
        .btn-submit {
            width: 100%;
            justify-content: center;
            padding: 13px;
            margin-top: var(--sp-3);
            animation: fadeUp 0.4s 0.25s ease backwards;
        }

        .btn-submit svg {
            flex-shrink: 0;
        }

        /* ── FOOTER NOTE ── */
        .card-footer {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border-secondary);
            font-size: var(--fs-caption);
            color: var(--text-tertiary);
            text-align: center;
            line-height: var(--lh-body);
            animation: fadeUp 0.4s 0.3s ease backwards;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .card {
                padding: 30px 22px 26px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body class="bg-ambient">
    <div class="card">

        <div class="card-header">
            <div class="card-brand">
                <span class="card-brand-dot"></span>
                <span class="card-brand-text">Server Monitor</span>
            </div>
            <h1><span class="hello-dim">→ </span>Sign in</h1>
            <div class="card-subtitle">Enter your credentials to continue</div>
        </div>

        {{if .Error}}
        <div class="error">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            {{.Error}}
        </div>
        {{end}}

        <form method="POST" action="/panel/login">

            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </span>
                    <input type="text" id="username" name="username" placeholder="admin" autofocus
                        autocomplete="username">
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="••••••••"
                        autocomplete="current-password">
                    <button type="button" class="eye-btn" id="eye-btn" aria-label="Toggle password visibility">
                        <svg id="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg id="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary btn-submit">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                </svg>
                Log In
            </button>

        </form>

        <div class="card-footer">
            Monitoring &mdash; Restricted Access
        </div>

    </div>

    <script>
        (function () {
            var eyeBtn = document.getElementById('eye-btn');
            var pwdInput = document.getElementById('password');
            var eyeOpen = document.getElementById('eye-open');
            var eyeClosed = document.getElementById('eye-closed');

            eyeBtn.addEventListener('click', function () {
                var isPass = pwdInput.type === 'password';
                pwdInput.type = isPass ? 'text' : 'password';
                eyeOpen.style.display = isPass ? 'none' : '';
                eyeClosed.style.display = isPass ? '' : 'none';
            });
        })();
    </script>
</body>

</html>
